name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
concurrency:
  group: release-${{ github.ref }}
jobs:
  release:
    runs-on: macos-14
    env:
      SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - uses: pnpm/action-setup@v5
      - run: pnpm install --frozen-lockfile
      - run: pnpm check:version
      - name: Check release tag
        run: test "$GITHUB_REF_NAME" = "v$(node -p 'require("./package.json").version')"
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --workspace -- -D warnings
      - run: cargo test --locked --workspace
      - run: scripts/bundle.sh
      - run: codesign --verify --deep --strict dist/Pinch.app
      - name: Import signing credentials
        if: env.SIGNING_IDENTITY != ''
        env:
          CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          test -n "$CERTIFICATE"
          KEYCHAIN_PASSWORD=$(openssl rand -hex 24)
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$RUNNER_TEMP/pinch.keychain-db"
          security set-keychain-settings -lut 21600 "$RUNNER_TEMP/pinch.keychain-db"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$RUNNER_TEMP/pinch.keychain-db"
          printf '%s' "$CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security import "$RUNNER_TEMP/certificate.p12" -k "$RUNNER_TEMP/pinch.keychain-db" -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -k "$KEYCHAIN_PASSWORD" "$RUNNER_TEMP/pinch.keychain-db"
          security list-keychains -d user -s "$RUNNER_TEMP/pinch.keychain-db" login.keychain-db
          xcrun notarytool store-credentials pinch-release --apple-id "$APPLE_ID" --password "$APPLE_PASSWORD" --team-id "$APPLE_TEAM_ID"
      - name: Package Apple Silicon app
        env:
          SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
          NOTARY_PROFILE: pinch-release
          PINCH_REPOSITORY: ${{ github.repository }}
        run: |
          scripts/release.sh
      - name: Create draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" --verify-tag --draft --generate-notes --title "Pinch $GITHUB_REF_NAME" dist/pinch-macos-arm64.zip dist/pinch-macos-arm64.zip.sha256 dist/install.sh LICENSE
      - name: Clean signing credentials
        if: always() && env.SIGNING_IDENTITY != ''
        run: |
          security delete-keychain "$RUNNER_TEMP/pinch.keychain-db" || true
          rm -f "$RUNNER_TEMP/certificate.p12"

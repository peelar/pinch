name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          package-manager-cache: false
      - name: Install Rust toolchain
        run: rustup show
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Check engine boundaries
        run: python3 scripts/check_architecture.py
      - name: Build without desktop integration
        run: cargo check -p pinch-engine -p pinch-cli --no-default-features --locked
      - name: Clippy
        run: cargo clippy --workspace --locked
      - name: Tests
        run: cargo test --workspace --locked
      - name: Build integration-test binaries
        run: cargo build --workspace --locked
      - name: Integration tests
        run: python3 -m unittest discover -s scripts/tests -v
      - name: Check release versions
        run: node scripts/sync-version.mjs --check
      - name: Check shell scripts
        run: bash -n scripts/bundle.sh scripts/install.sh scripts/release.sh

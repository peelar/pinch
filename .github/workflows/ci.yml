name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        run: rustup show
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --locked
      - name: Tests
        run: cargo test --workspace --locked
      - name: Check release versions
        run: node scripts/sync-version.mjs --check
      - name: Check shell scripts
        run: bash -n scripts/bundle.sh scripts/install.sh scripts/release.sh

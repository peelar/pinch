name: Changeset
on:
  pull_request:
permissions:
  contents: read
jobs:
  changeset:
    name: Require changeset
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - uses: pnpm/action-setup@v5
      - run: pnpm install --frozen-lockfile
      - name: Require a new changeset with a version bump
        if: github.head_ref != 'changeset-release/main' || github.event.pull_request.user.login != 'github-actions[bot]' || github.event.pull_request.head.repo.full_name != github.repository
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if ! git diff --name-only --diff-filter=A "$BASE_SHA"...HEAD -- '.changeset/*.md' ':!.changeset/README.md' | grep -q .; then
            echo '::error::Every PR must add a changeset. Run pnpm changeset and commit the generated file.'
            exit 1
          fi
          pnpm changeset status --since "$BASE_SHA" --output "$RUNNER_TEMP/changeset-status.json"
          node --input-type=module -e '
            import { readFileSync } from "node:fs";
            const status = JSON.parse(readFileSync(`${process.env.RUNNER_TEMP}/changeset-status.json`, "utf8"));
            if (!status.releases.some(release => release.name === "pinch")) {
              throw new Error("The changeset must include a version bump for pinch.");
            }
          '
